[workspace]
members = [
    "emulator-core",
    "cmd-emulator",
    "bash-emulator",
    "powershell-emulator",
    "windows-script-emulator",
    "runbox-emulator",
    "clickfix-detect",
    "clickfix-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8.4"
aho-corasick = "1.1.4"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc"] }
clap = { version = "4.5.48", features = ["derive"] }
flate2 = "1.1.2"
hex = "0.4.3"
md-5 = "0.10.6"
regex = "1.11.2"
rustyline = { version = "=14.0.0", default-features = false }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.16"
urlencoding = "2.1.3"
url = "=2.4.1"
ureq = { version = "=2.10.1", default-features = false, features = ["tls"] }
wasm-bindgen = "=0.2.117"
serde-wasm-bindgen = "0.6.5"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
