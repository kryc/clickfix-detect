[package]
name = "powershell-emulator-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
emulator-core = { path = "../../emulator-core" }
libfuzzer-sys = "0.4.10"
powershell-emulator = { path = ".." }

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "emulator"
path = "fuzz_targets/emulator.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
